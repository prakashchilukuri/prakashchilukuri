<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Sri Prakash — Developer identity</title>
  <desc id="desc">A burgundy editorial banner with subtle animated gradients, technical grid, orbit geometry and a glowing underline.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/><stop offset="0.56" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="hero-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.12"><animate attributeName="stop-opacity" values="0.12;0.42;0.12" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="0.52" stop-color="#C77B9B" stop-opacity="0.28"><animate attributeName="stop-opacity" values="0.28;0.55;0.28" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#451126" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="hero-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/><stop offset="0.5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <pattern id="hero-grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#E5B5C7" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <radialGradient id="hero-halo"><stop offset="0" stop-color="#C77B9B" stop-opacity="0.22"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></radialGradient>
    <filter id="hero-soft-glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <mask id="hero-fade"><rect width="1200" height="390" fill="url(#hero-bg)"/><circle cx="990" cy="165" r="290" fill="white"/></mask>
  </defs>
  <rect width="1200" height="390" rx="22" fill="url(#hero-bg)"/>
  <rect width="1200" height="390" rx="22" fill="url(#hero-grid)"/>
  <rect width="1200" height="390" rx="22" fill="url(#hero-glow)" mask="url(#hero-fade)"/>
  <circle cx="990" cy="155" r="270" fill="url(#hero-halo)"/>
  <g fill="none" stroke="#E5B5C7" stroke-opacity="0.23">
    <ellipse cx="1000" cy="175" rx="205" ry="72" transform="rotate(-28 1000 175)"/>
    <ellipse cx="1000" cy="175" rx="205" ry="72" transform="rotate(48 1000 175)"/>
    <circle cx="1000" cy="175" r="112" stroke-dasharray="2 10"/>
  </g>
  <g fill="#E5B5C7">
    <circle cx="836" cy="87" r="3"/><circle cx="1126" cy="213" r="3"/><circle cx="1011" cy="61" r="2"/>
    <circle cx="930" cy="292" r="2.5"/><circle cx="1080" cy="80" r="2"/>
  </g>
  <circle r="5" fill="#E5B5C7" filter="url(#hero-soft-glow)">
    <animateMotion dur="18s" repeatCount="indefinite" path="M836 87 C950 15 1140 90 1126 213 C1100 330 940 335 930 292 C870 230 790 150 836 87"/>
  </circle>
  <path d="M0 324 C220 300 330 350 520 322 S850 296 1200 325" fill="none" stroke="#C77B9B" stroke-opacity="0.2" stroke-width="1.2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#F8F0F3">
    <text x="82" y="155" font-size="18" letter-spacing="5" fill="#C77B9B">ENGINEERING / IMAGINATION</text>
    <text x="78" y="235" font-size="76" letter-spacing="-2">Sri Prakash</text>
  </g>
  <text x="84" y="276" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="2.2" fill="#E5B5C7">AI / ML  ·  FULL-STACK  ·  DATA</text>
  <path d="M84 304 H500" fill="none" stroke="#701A3D" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <path d="M84 304 H500" fill="none" stroke="url(#hero-line)" stroke-width="2.2" stroke-linecap="round" filter="url(#hero-soft-glow)" stroke-dasharray="416" stroke-dashoffset="416">
    <animate attributeName="stroke-dashoffset" values="416;0;0" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <text x="84" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#C77B9B">BUILD WITH PURPOSE · LEARN IN PUBLIC</text>
  <text x="1115" y="350" text-anchor="end" font-family="monospace" font-size="11" letter-spacing="2" fill="#E5B5C7" opacity="0.7">PROFILE / 01</text>
</svg>
