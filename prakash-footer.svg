<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Burgundy decorative footer</title>
  <defs>
    <linearGradient id="footer-stroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#451126"/><stop offset="0.5" stop-color="#C77B9B"/><stop offset="1" stop-color="#451126"/></linearGradient>
    <filter id="footer-glow" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M0 56 C160 56 175 18 300 40 S480 90 600 56 S830 22 940 48 S1080 60 1200 56" fill="none" stroke="#701A3D" stroke-opacity="0.22" stroke-width="10"/>
  <path d="M0 56 C160 56 175 18 300 40 S480 90 600 56 S830 22 940 48 S1080 60 1200 56" fill="none" stroke="url(#footer-stroke)" stroke-width="1.8" filter="url(#footer-glow)" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="18s" repeatCount="indefinite"/>
  </path>
  <g fill="#C77B9B" opacity="0.8"><circle cx="300" cy="40" r="3"/><circle cx="600" cy="56" r="3"/><circle cx="940" cy="48" r="3"/></g>
</svg>
